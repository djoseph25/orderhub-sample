# Local emulators: Azurite (Blob/Table/Queue) and the Service Bus emulator.
#   docker compose -f emulators/docker-compose.yml up -d
# Without Docker: install Azurite via `npm i -g azurite` (or VS Code extension) and point "ServiceBus" at a dev namespace.

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports: ["10000:10000", "10001:10001", "10002:10002"]

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on: [sqledge]
    ports: ["5672:5672"]
    volumes:
      - ./servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "LocalOnly_Passw0rd!"   # local emulator only
      ACCEPT_EULA: "Y"

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalOnly_Passw0rd!"
